[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vsem-fibsemos"
version = "0.0.0.dev1"
description = "Unqualified source prototype for an optional observable-only vSEM adapter"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.entry-points."fibsem.drivers"]
vsem = "vsem_fibsemos.plugin:driver_entry"

[tool.setuptools.packages.find]
where = ["src"]
