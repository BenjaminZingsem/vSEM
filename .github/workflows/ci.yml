name: CPU science and observable boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s acceptance -p 'test_*.py'
      - run: node acceptance/test_scan_display_buffer.js
      - run: node acceptance/audit_intensity_transfer.js apps/web/intensity_transfer.js acceptance/intensity_transfer_cases.json
      - run: python -B scripts/audit_publication.py
